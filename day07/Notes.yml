4.compared to Sel why we use playwright?

To automate web application
we required :
- browser 
- Editor to write a code -> which lang going to use ? - Js and Ts
- Architecure means whathevr code is written how its going to interact with browser

Selenium arch (Java, python whatever)
Selenium with java arch example:
Each browser - will have diff driver(Set of softwares) - lets assume drivers written in java

Lets say,se java (code) will send a api request to Driver (written in java)
requires browser specific drivers
b/wn these two there is a translator (w3c)
(w3c) - world wide web consortium (www.) - w3 act as protocol to transfer a request from code to driver

code will sends a request to browser
then browser sends a response back

Playwright arch example:
pw will not have a seperate drivers only node server
all browser present in single playwright node server
protocol - websocket is used in playwright

send websocket cmd thru websocket API - sent as websocket request --> will check browser availability
then browser - it send response back

selenium vs playwright req and response:
sel: 
for each code seperate request and response will happen thru w3c and connection get disabled once completed

playwright:
request and response will happen thru websocket on same path (package) and connection 
will not disconnected until all lines executed

hint : everytime it has to be established in connection in se but not in pw

Plawright (websocket) - full duplex (2 way communication), long lived connection 
(whatsapp is an example for pw response)
(Bank app is an example for se response)


